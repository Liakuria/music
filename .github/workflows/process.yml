name: Music to Piano

on:
  push:
    paths:
      - "input/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fluidsynth

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy librosa soundfile mido pretty_midi
          pip install basic-pitch
          pip install demucs
          pip install music21

      - name: Find input file
        id: input
        shell: bash
        run: |
          FILE=$(find input -type f \
            \( -iname "*.mp4" \
            -o -iname "*.mov" \
            -o -iname "*.m4v" \
            -o -iname "*.webm" \
            -o -iname "*.mp3" \
            -o -iname "*.wav" \
            -o -iname "*.m4a" \
            \) | head -n 1)

          if [ -z "$FILE" ]; then
            echo "No input media file found."
            exit 1
          fi

          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Process audio
        env:
          INPUT_FILE: ${{ steps.input.outputs.file }}
        run: |
          python tools/process.py "$INPUT_FILE"

      - name: Show generated files
        run: |
          echo "===== OUTPUT ====="
          find output -type f -maxdepth 3 -print || true

      - name: Commit generated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/

          if git diff --cached --quiet; then
            echo "No output changes."
            exit 0
          fi

          git commit -m "Generate piano transcription"
          git push
